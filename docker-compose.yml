services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '5173:5173'
    env_file:
      # `make db-push ENV_FILE=.env.prod` runs a target against another project
      - path: ${ENV_FILE:-.env}
        required: false
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
